version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # Majors que requieren migración dedicada (no auto-bump):
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"        # v4 = PostCSS plugin separado + config CSS-first; toca tokens de marca
        update-types: ["version-update:semver-major"]
      - dependency-name: "next-sanity"        # v11+ exige Next 16; atado al major de next (ya bloqueado)
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"         # TS 6 puede romper tipos; revisar aparte
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"        # debe seguir el runtime de Node (20), no saltar a 25
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
